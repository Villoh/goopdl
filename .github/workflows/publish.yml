name: Publish to PyPI

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (without leading v), e.g. 2.0.0"
        required: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.set_version.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"

      - name: Set version from tag
        id: set_version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          VERSION="${INPUT_VERSION:-${GITHUB_REF_NAME#v}}"
          sed -i "s/version = \"0.0.0\"/version = \"$VERSION\"/" pyproject.toml
          sed -i \
            "s/__version__ = \"0.0.0\"/__version__ = \"$VERSION\"/" \
            goopdl/__init__.py
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install build tools
        run: pip install build

      - name: Build package
        run: python -m build

      - name: Upload artifacts
        # v7
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: dist
          path: dist/

  binaries:
    needs: build
    strategy:
      fail-fast: true
      matrix:
        include:
          # Linux builds on 22.04 so the binary runs on older glibc.
          - target: linux-x86_64
            os: ubuntu-22.04
            ext: ""
          - target: linux-arm64
            os: ubuntu-22.04-arm
            ext: ""
          - target: macos-arm64
            os: macos-latest
            ext: ""
          # Last Intel runner GitHub offers (until August 2027).
          - target: macos-x86_64
            os: macos-15-intel
            ext: ""
          - target: windows-x86_64
            os: windows-latest
            ext: ".exe"
          - target: windows-arm64
            os: windows-11-arm
            ext: ".exe"
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"

      - name: Set version from tag
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          VERSION="${INPUT_VERSION:-${GITHUB_REF_NAME#v}}"
          sed -i.bak \
            "s/__version__ = \"0.0.0\"/__version__ = \"$VERSION\"/" \
            goopdl/__init__.py

      - name: Build binary
        env:
          EXT: ${{ matrix.ext }}
          TARGET: ${{ matrix.target }}
        run: |
          bash scripts/build_binary.sh
          mv "dist/goopdl${EXT}" "goopdl-${TARGET}${EXT}"

      - name: Smoke test
        env:
          EXT: ${{ matrix.ext }}
          TARGET: ${{ matrix.target }}
        run: bash scripts/smoke_binary.sh "./goopdl-${TARGET}${EXT}"

      # v7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: bin-${{ matrix.target }}
          path: goopdl-${{ matrix.target }}${{ matrix.ext }}

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/goopdl
    permissions:
      id-token: write
    steps:
      - name: Download artifacts
        # v8
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        # v1.14.3 (release/v1)
        uses: >-
          pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086
        with:
          skip-existing: true

  release:
    needs: [build, binaries]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Download artifacts
        # v8
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: dist
          path: dist/

      - name: Download binaries
        # v8
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: bin-*
          merge-multiple: true
          path: bin/

      - name: Checksums
        run: cd bin && sha256sum goopdl-* > SHA256SUMS

      - name: Get previous tag
        id: previous
        env:
          CURRENT_TAG: ${{ needs.build.outputs.tag }}
        run: |
          PREV=$(git describe --tags --abbrev=0 "$CURRENT_TAG^" \
            2>/dev/null || echo "")
          echo "tag=$PREV" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        # v3
        uses: >-
          softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228
        with:
          tag_name: ${{ needs.build.outputs.tag }}
          previous_tag: ${{ steps.previous.outputs.tag }}
          generate_release_notes: true
          files: |
            bin/*
