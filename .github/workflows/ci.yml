name: CI

on:
  push:
    branches: [main, "feat/**", "fix/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9
        with:
          version: "0.11.32"
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv lock --check
      - run: uv sync --locked
      - run: uv run python -m unittest discover -s tests
      - run: uv run python -m compileall -q goopdl tests

  windows-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9
        with:
          version: "0.11.32"
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv lock --check
      - run: uv sync --locked
      - run: uv run python -m unittest discover -s tests
      - run: uv run python -m compileall -q goopdl tests

  # The release binaries of publish.yml (same runners, Python and scripts), so
  # a tag never meets a target that was not built before. Keep both in step.
  binary-smoke:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-22.04, ext: ""}
          - {os: ubuntu-22.04-arm, ext: ""}
          - {os: macos-latest, ext: ""}
          - {os: macos-15-intel, ext: ""}
          - {os: windows-latest, ext: ".exe"}
          - {os: windows-11-arm, ext: ".exe"}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - run: bash scripts/build_binary.sh
      - env:
          EXT: ${{ matrix.ext }}
        run: bash scripts/smoke_binary.sh "dist/goopdl${EXT}"

  nix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@2126ae7fc54c9df00dd18f7f18754393182c73cd # v31.9.1
      - run: nix flake check
      - run: nix build .#default --print-build-logs
