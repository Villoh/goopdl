[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "goopdl"
version = "1.2.0"
description = "Download APKs from Google Play Store with anonymous authentication"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [{ name = "Mikel Villota", email = "mikelvillotatic@gmail.com" }]
keywords = ["google-play", "apk", "downloader", "android"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Topic :: Utilities",
]
dependencies = [
  "typer>=0.9.0",
  "rich>=13.0.0",
  "httpx>=0.27.0",
  "websocket-client>=1.8.0",
]

[project.scripts]
goopdl = "goopdl.cli:app"

[project.urls]
Homepage = "https://github.com/Villoh/goopdl"
Repository = "https://github.com/Villoh/goopdl"
Issues = "https://github.com/Villoh/goopdl/issues"

[tool.setuptools.packages.find]
include = ["goopdl*"]

[tool.setuptools.package-data]
goopdl = ["profiles/*.properties"]
