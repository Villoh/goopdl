[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gpdl"
version = "0.0.0"
description = "Download APKs from Google Play Store with anonymous authentication"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [{ name = "Mikel Villota", email = "mikelvillotatic@gmail.com" }]
keywords = ["google-play", "apk", "downloader", "android"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Topic :: Utilities",
]
dependencies = ["typer>=0.9.0", "rich>=13.0.0", "httpx>=0.27.0"]

[project.scripts]
gpdl = "gpdl.cli:app"

[project.urls]
Homepage = "https://github.com/Villoh/gpdl"
Repository = "https://github.com/Villoh/gpdl"
Issues = "https://github.com/Villoh/gpdl/issues"

[tool.setuptools.packages.find]
include = ["gpdl*"]

[tool.setuptools.package-data]
gpdl = ["profiles/*.properties"]
