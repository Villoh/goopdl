  <main class="docs">
    <aside class="docs-side">
      <nav id="doc-nav" aria-label="{{nav_label}}">
{{sidebar}}
      </nav>
    </aside>
    <article class="md" id="doc">
{{content}}
      <div class="doc-foot">{{pager}}</div>
      <a class="doc-edit" href="{{edit_url}}">{{edit_label}} ↗</a>
    </article>
    <aside class="docs-toc">
      <p>{{toc_label}}</p>
      <nav class="toc" id="toc">
{{toc}}
      </nav>
    </aside>
  </main>
